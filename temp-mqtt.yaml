  sensor:
    # ----------------------------------------------------------------
    # ENVIRONMENTAL METRICS
    # ----------------------------------------------------------------
    - name: "Crawlspace Temperature"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      suggested_display_precision: 1
      unit_of_measurement: "°F"
      device_class: "temperature"
      state_class: "measurement"
      value_template: >-
        {% if value_json.payload is defined and value_json.payload.temperature is defined %}
          {{ value_json.payload.temperature | float * 1.8 + 32 }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_sht40_temp"
      device: &meshtastic_device
        identifiers: "meshtastic_45a45c34"
        name: "Crawlspace Node"
        model: "Heltec T114"
        manufacturer: "Sensirion SHT40"

    - name: "Crawlspace Humidity"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      suggested_display_precision: 1
      unit_of_measurement: "%"
      device_class: "humidity"
      state_class: "measurement"
      value_template: >-
        {% if value_json.payload is defined and value_json.payload.relative_humidity is defined %}
          {{ value_json.payload.relative_humidity | float }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_sht40_humidity"
      device: *meshtastic_device

    # ----------------------------------------------------------------
    # DIAGNOSTICS & SYSTEM METRICS
    # ----------------------------------------------------------------
    - name: "Crawlspace Node Uptime"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      unit_of_measurement: "s"
      device_class: "duration"
      entity_category: "diagnostic"
      value_template: >-
        {% if value_json.payload is defined and value_json.payload.uptime_seconds is defined %}
          {{ value_json.payload.uptime_seconds | int }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_node_uptime"
      device: *meshtastic_device

    - name: "Crawlspace Node Battery"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      unit_of_measurement: "%"
      device_class: "battery"
      state_class: "measurement"
      entity_category: "diagnostic"
      value_template: >-
        {% if value_json.payload is defined and value_json.payload.battery_level is defined %}
          {{ value_json.payload.battery_level | int }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_node_battery"
      device: *meshtastic_device

    # ----------------------------------------------------------------
    # POSITION METRICS
    # ----------------------------------------------------------------
    - name: "Crawlspace Node Latitude"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      value_template: >-
        {% if value_json.type == 'position' and value_json.payload.latitude_i is defined %}
          {{ value_json.payload.latitude_i / 10000000 }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_node_lat"
      device: *meshtastic_device

    - name: "Crawlspace Node Longitude"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      value_template: >-
        {% if value_json.type == 'position' and value_json.payload.longitude_i is defined %}
