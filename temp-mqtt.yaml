        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_node_lon"
      device: *meshtastic_device
    # ----------------------------------------------------------------
    # LORA SIGNAL METRICS
    # ----------------------------------------------------------------
    - name: "Crawlspace Node SNR"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      unit_of_measurement: "dB"
