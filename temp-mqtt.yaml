          {{ value_json.snr | float }}
        {% else %}
          {{ this.state }}
        {% endif %}
      unique_id: "crawlspace_node_snr"
      device: *meshtastic_device

    - name: "Crawlspace Node RSSI"
      state_topic: "msh/Home/2/json/riverlight/!45a45c34"
      unit_of_measurement: "dBm"
      device_class: "signal_strength"
      state_class: "measurement"
      entity_category: "diagnostic"
      value_template: >-
