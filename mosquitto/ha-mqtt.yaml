# =============================================================================
#  Home Assistant MQTT entities for the Rental Monitor.
#  This file is the CONTENTS of the `mqtt:` key — include it from
#  configuration.yaml with:   mqtt: !include mqtt/rental-monitor.yaml
#  (Reads per-sensor JSON from ha-bridge.py + the device's JSON health topic.)
# =============================================================================
sensor:
  # ---- crawl ----
  - name: "Rental Crawlspace Temperature"
    unique_id: rentalmon_crawl_c
    state_topic: "rental/rental-mon-01/sensor/crawl"
    value_template: "{{ value_json.c | default(None) }}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    suggested_display_precision: 1
    device:
      suggested_area: "Rental"
      name: "Rental Monitor"
      identifiers: "rental_mon_01"
    availability:
      - topic: "rental/rental-mon-01/health"
        value_template: "{{ 'online' if value_json.online else 'offline' }}"
        payload_available: "online"
        payload_not_available: "offline"

  - name: "Rental Crawlspace Humidity"
