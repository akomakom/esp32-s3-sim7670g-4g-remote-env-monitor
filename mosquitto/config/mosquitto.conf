# =============================================================================
#  Mosquitto config for the Rental Monitor broker.
#  Runs in Docker with --net=host, so listener ports bind directly on the host.
#
#  Two listeners:
#    1883  plaintext, anonymous  — LAN/local use (Home Assistant, etc.), as before
#    8883  TLS + MUTUAL auth      — internet-facing; forward WAN 8883 -> host 8883
#
#  Per-listener settings let 1883 stay anonymous while 8883 demands both a
#  client certificate AND a username/password.
# =============================================================================

# ---- global (must be set before any listener) -------------------------------
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# ---- Listener 1: plaintext LAN, anonymous (unchanged behaviour) -------------
listener 1883
allow_anonymous true

# ---- Listener 2: TLS, mutual-auth, internet-facing --------------------------
#  The device connects to MQTT_HOST:MQTT_PORT = broker.example.com:8883.
#  Point your router's port-forward at this host:8883 (see mosquitto/README.md).
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS material (mounted under the config volume at /mosquitto/config/certs)
cafile   /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile  /mosquitto/config/certs/server.key

# Mutual TLS: reject any client whose cert is not signed by our CA above.
require_certificate true
# We authenticate the device by username/password (not by cert CN), so keep the
# certificate identity out of the MQTT username.
use_identity_as_username false

# Pin to TLS 1.2 (fully supported by the ESP32 mbedTLS stack).
tls_version tlsv1.2
