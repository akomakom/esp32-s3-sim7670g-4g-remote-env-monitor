; =============================================================================
;  PlatformIO build for the Rental Unit Environmental Monitor
;  Board: Waveshare ESP32-S3-SIM7670G-4G  (ESP32-S3, 16MB flash, 2MB PSRAM)
;  Requires the ESP32 Arduino core 3.x (native PPP class + modern TLS).
; =============================================================================
[platformio]
default_envs = rental_monitor

[env:rental_monitor]
; The stock platformio/espressif32 platform only ships Arduino-ESP32 core 2.0.x.
; This firmware uses core 3.x APIs (PPP class, NetworkClientSecure), which are
; provided by the community pioarduino platform fork.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-s3-devkitc-1        ; S3, 16MB flash — matches the module
framework = arduino

board_build.flash_size    = 16MB
board_build.partitions    = partitions_ota.csv   ; dual-OTA w/ rollback
board_build.arduino.memory_type = qio_opi        ; enable PSRAM

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ---- Override secrets/host here so they need not be committed ----
    ; -DDEVICE_ID=\"rental-mon-01\"
    ; -DMQTT_HOST=\"broker.example.com\"
    ; -DMQTT_PORT=8883
    ; -DMQTT_USERNAME=\"rental-mon-01\"
    ; -DMQTT_PASSWORD=\"...\"
    ; -DCELL_APN=\"hologram\"

lib_deps =
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    4-20ma/ModbusMaster @ ^2.0.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0

; The PPP, NetworkClientSecure, HTTPClient, Update, LittleFS, Preferences and
; Wire libraries are all part of the ESP32 Arduino core 3.x — no lib_deps needed.
