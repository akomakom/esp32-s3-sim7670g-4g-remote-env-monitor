; =============================================================================
;  PlatformIO build for the Rental Unit Environmental Monitor
;  Board: Waveshare ESP32-S3-SIM7670G-4G  (ESP32-S3, 16MB flash, 2MB PSRAM)
;  Requires the ESP32 Arduino core 3.x (native PPP class + modern TLS).
; =============================================================================
[platformio]
default_envs = rental_monitor

[env:rental_monitor]
; The stock platformio/espressif32 platform only ships Arduino-ESP32 core 2.0.x.
; This firmware uses core 3.x APIs (PPP class, NetworkClientSecure), which are
; provided by the community pioarduino platform fork.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-s3-devkitc-1        ; S3, 16MB flash — matches the module

; --- Arduino as an ESP-IDF component ---
; USB-host cellular (the modem talks over USB on this board, and PPP-over-UART
; isn't supported by the SIM7670G) is an ESP-IDF-native feature: it needs
; esp_modem + usb_host_cdc_acm + the USB CDC-ACM DTE. Those are first-class only
; on the IDF framework, so we build ON ESP-IDF and pull Arduino in as a component
; (keeps all our Arduino code: Wire/SHT40, Modbus, ESP-NOW, NetworkClientSecure).
; IDF components are declared in src/idf_component.yml; kernel options live in
; sdkconfig.defaults. First build is long (compiles the core from source).
framework = arduino, espidf

board_build.flash_size    = 16MB
; espidf partition-table generation reads flash size from board_upload.flash_size
; (NOT board_build.flash_size), so set it here or the partition check assumes 8MB.
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions_ota.csv   ; dual-OTA w/ rollback

; Pre-build: regenerate include/git_rev.h with the current git short hash, which
; config.h appends to FW_VERSION (reported in boot log + health telemetry).
extra_scripts = pre:git_rev.py

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ---- Bench testing without a SIM? Uncomment to skip the modem entirely. ----
    ; -DCELLULAR_ENABLED=0
    ; ---- Override secrets/host here so they need not be committed ----
    ; -DDEVICE_ID=\"rental-mon-01\"
    ; -DMQTT_HOST=\"broker.example.com\"
    ; -DMQTT_PORT=8883
    ; -DMQTT_USERNAME=\"rental-mon-01\"
    ; -DMQTT_PASSWORD=\"...\"
    ; -DCELL_APN=\"hologram\"

lib_deps =
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    4-20ma/ModbusMaster @ ^2.0.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.3

; The PPP, NetworkClientSecure, HTTPClient, Update, LittleFS, Preferences and
; Wire libraries are all part of the ESP32 Arduino core 3.x — no lib_deps needed.
